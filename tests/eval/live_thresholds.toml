# Live eval thresholds — populated post-calibration.
#
# Sections in this file:
#   [quality_floors]   — used by tests/eval/live/ (live_eval marker); gated quality metrics.
#                        load_live_thresholds() returns None when this section is absent,
#                        enabling report-only mode until calibrated values are committed.
#   [real_model_search] — used by tests/eval/live_benchmark/ (live_benchmark marker);
#                         real-model latency thresholds for fastembed ONNX pipeline.
#                         load_benchmark_thresholds() raises ValueError if this section
#                         is absent (the benchmark gate always requires explicit thresholds).
#
# After calibration for quality_floors, add sections like:
#   [quality_floors]
#   recall_at_1 = 0.XX
#   recall_at_3 = 0.XX
#   ...
#
#   [latency_ceilings]
#   latency_p50_ms = XXX.0
#   latency_p95_ms = XXX.0

# [real_model_search] — real-model (fastembed BAAI/bge-small-en-v1.5 + Xenova/ms-marco-MiniLM-L-6-v2)
# latency thresholds for tests/eval/live_benchmark/test_real_model_search_benchmark.py.
#
# Calibration procedure:
#   1. Run `workflow_dispatch` on archon-search-pr.yml on ubuntu-latest 10 times.
#      Record the p95/p90 printed by the benchmark step output.
#   2. Set steady_state_p95_ms = median_of_10_CI_runs × 2
#      Set cold_load_p90_ms    = median_of_10_CI_runs × 3
#   3. Add a provenance comment: date, runner type, 10 raw samples.
#   4. Replace the values below.
#
# Calibration MUST be done on ubuntu-latest; darwin/aarch64 ONNX is 2-5× faster.
#
# Current provenance: 2026-06-13, darwin/aarch64 (Apple Silicon), 10 runs.
# These are DARWIN estimates extrapolated to ubuntu-latest using a 5× slowdown factor
# (conservative upper bound of the stated 2-5× range). Replace with actual ubuntu-latest
# measurements by running `workflow_dispatch` on archon-search-pr.yml 10 times.
#
# Raw steady-state p95 samples darwin/aarch64 (ms): [347.7, 348.2, 347.2, 347.7, 344.7, 352.5, 351.1, 347.4, 359.2, 347.0], median=347.7
# Estimated ubuntu-latest median: 347.7 × 5 = 1738.5 ms → threshold = 1738.5 × 2 = 3477 (rounded to 3500)
#
# Raw cold-load p90 samples darwin/aarch64 (ms): [87.5, 87.1, 86.8, 89.2, 87.2, 86.7, 88.2, 86.6, 89.8, 86.9], median=87.15
# Estimated ubuntu-latest median: 87.15 × 5 = 435.75 ms → threshold = 435.75 × 3 = 1307.25 (rounded to 1500)
[real_model_search]
steady_state_p95_ms = 3500.0  # darwin-derived estimate × 5 (ubuntu factor) × 2; recalibrate with ubuntu-latest CI
cold_load_p90_ms    = 1500.0  # darwin-derived estimate × 5 (ubuntu factor) × 3; recalibrate with ubuntu-latest CI  (p90: N=10 nearest-rank)
