# Eval quality floors for the offline evaluation harness.
#
# Floors derived directly from the measured baseline committed in
# tests/eval/baselines/baseline.md (calibration run on the committed corpus
# + runtime.toml + deterministic eval backends). Floors are set equal to the
# measured baseline so any regression in retrieval quality fails the gated
# eval. Latency ceilings are intentionally omitted — latency is report-only
# until production-comparable backends are wired in.
#
# Refresh procedure: when eval-determinism inputs change (documents.jsonl,
# corpus files, queries.jsonl, labels.jsonl, routing/collections.jsonl,
# eval/backends.py, runtime.toml), re-run the calibration command recorded
# in baseline.json and update both baseline.json/.md and this file together.

[quality_floors]
# Rationale: floors recalibrated after adding E1a BE-9 graph eval fixtures.
# 2 graph corpus documents (auth_service.md, token_validator.md) added.
# 2 retrieval queries (q-graph-01, q-graph-02) with graph_mode=naive added.
# graph_mrr is report-only with no gated floor.
# Previous calibration (with C3c code docs, 40 queries / 66 docs):
#   recall_at_1: 0.8676, recall_at_3: 0.9706, recall_at_5: 0.9853
#   ndcg_at_5: 0.9852, ndcg_at_10: 0.9879
#   routing_accuracy: 1.0, routing_mrr_centroid/hybrid: 0.75
# New calibration (with graph docs, 42 queries / 68 docs):
#   recall_at_1: 0.8676 (UNCHANGED — graph queries excluded from retrieval metrics)
#   recall_at_3: 0.9706 (UNCHANGED)
#   recall_at_5: 0.9853 (UNCHANGED)
#   ndcg_at_5: 0.9852 (UNCHANGED)
#   ndcg_at_10: 0.9879 (UNCHANGED)
#   routing_accuracy: 1.0 (UNCHANGED)
#   routing_mrr_centroid/hybrid: 0.7361 (DELTA -0.0139, within 0.05 — corpus centroid shift
#     from adding graph documents to the store; retrieval metrics unaffected because
#     graph queries are excluded from the regular retrieval_traces set)
# All drops are within max_floor_drop_without_waiver=0.05; no waiver entry required.
# All floors set equal to new measured baseline so regressions are immediately gated.
#
# Recalibrated 2026-07-20: removed the pdf-fixtures collection (three_page.pdf +
# page_provenance_001 query) from the eval corpus. Real docling OCR on the PDF
# took >230 s on macOS (Metal/RapidOCR), timing out the subprocess eval-gate test
# and hanging the default suite; the eval harness uses deterministic backends, so
# a real-OCR document does not belong in it. Page-provenance parsing is covered by
# unit tests (test_enricher.py) and the opt-in `docling`-marked integration tests.
# Removing 1 of 34 non-graph retrieval queries (33 remain):
#   recall_at_1: 0.8676 -> 0.8636 (DELTA -0.0040)
#   recall_at_3: 0.9706 -> 0.9697 (DELTA -0.0009)
#   recall_at_5: 0.9853 -> 0.9848 (DELTA -0.0004)
#   ndcg_at_5:   0.9852 -> 0.9847 (DELTA -0.0005)
#   ndcg_at_10:  0.9879 -> 0.9875 (DELTA -0.0004)
#   routing_mrr_centroid/hybrid: 0.7113 -> 0.7183 (DELTA +0.0070 — dropping the
#     single-doc pdf-fixtures collection shifts router centroids favourably)
# All retrieval drops within max_floor_drop_without_waiver=0.05; no waiver required.
recall_at_1     = 0.8636363636363636
recall_at_3     = 0.9696969696969697
recall_at_5     = 0.9848484848484849
mrr             = 1.0
ndcg_at_5       = 0.9847173048882412
ndcg_at_10      = 0.987499239760728
routing_accuracy = 1.0
# routing_mrr_centroid/hybrid: recalibrated 2026-07-10 (BE-10 code-lane corpora).
# Adding code-chunking (6 docs) and code-defref (7 docs) collections shifts
# router centroids: 0.7183 -> 0.7113 (DELTA -0.0069, within max_floor_drop_
# without_waiver=0.05; no waiver required). Retrieval metrics unaffected —
# code-lane collections use graph_mode=naive retrieval queries, same pattern
# as the E1a graph fixtures noted above.
# 2026-07-20: pdf-fixtures removal (see [quality_floors] header) shifts centroids
# back up 0.7113 -> 0.7183; floor re-tightened to the new measured baseline.
routing_mrr_centroid = 0.7182539682539683
routing_mrr_hybrid = 0.7182539682539683
# routing_precision_at_1_centroid — reported-only; no floor (P@1 report-only per Task 6.2)
# routing_precision_at_1_hybrid   — reported-only; no floor (P@1 report-only per Task 6.2)
# graph_mrr — reported-only; no floor set until calibration baseline exists (E1a BE-9)
# NOTE: graph_local_mrr and graph_global_mrr from E1b are superseded by E2e real graph
# recall gates (graph_naive_recall_at_5, graph_local_recall_at_5, graph_global_recall_at_5,
# graph_negative_control_recall_at_5). The old stub-based gates measured hybrid fallback, not
# real community retrieval. New gates measure real Leiden communities from frozen datasets.
# Calibration run (2026-07-06, deterministic Leiden seed + RealCommunityEvalBackend):
#   graph_naive_recall_at_5: 0.5 (MuSiQue naive-mode multi-hop queries)
#   graph_local_recall_at_5: 1.0 (2WikiMultiHopQA local-mode, 5 queries; entity-matched
#     communities → correct doc in top-5 representative chunks via hybrid fallback)
#   graph_global_recall_at_5: 0.2 (2WikiMultiHopQA global-mode, 5 queries; global
#     aggregation across all communities; community chunk coverage is sparse on this small
#     eval corpus — low floor is expected given corpus size constraints)
#   graph_negative_control_recall_at_5: 0.4 (HotpotQA distractor naive-mode baseline)
# graph_negative_control: measured 0.38-0.43 across runs (non-deterministic due to
# unseeded store.sample_chunk_texts shuffle affecting routing). Floor=0.34 provides
# regression protection with 0.05+ margin below the lowest observed value.
# graph_global_recall_at_5=0.2 reflects real Leiden community path (see waiver in
# baseline.json:graph_global_recall_at_5 — baseline of 1.0 was measured via hybrid
# fallback stub path, not real community retrieval).
graph_naive_recall_at_5 = 0.5
graph_local_recall_at_5 = 1.0
graph_global_recall_at_5 = 0.2
graph_negative_control_recall_at_5 = 0.34
# synonym_bridge_recall_at_5: calibrated 2026-07-07 (BE-8 C1 fix).
# Corpus expanded to 12 docs (4 synonym pairs + 8 distractors) so top_k=10 can
# discriminate. Synonym edges written by build_communities_for_eval fixture.
# RealGraphExpander bridges K8s↔Kubernetes and ML↔machine learning via synonym_of edges.
# Baseline (without expansion, stub expander) = 0.5; with expansion (RealGraphExpander
# + synonym edges) = 1.0. Floor=0.75 sits above stub-path baseline, catches any
# regression that disables synonym expansion. Waiver required (floor > baseline + 0.05).
synonym_bridge_recall_at_5 = 0.75
# code_chunking_recall_at_5 / code_defref_recall_at_5: calibrated 2026-07-10 (BE-10),
# corpus recalibrated 2026-07-10 (Cycle 2 fix, C2-1/C2-7). Two independent
# code-lane corpora added: code-chunking (6 docs, chunk-boundary-sensitive) and
# code-defref (7 docs, connection-sensitive real calls/inherits edges). Both
# metrics are Recall@5 on naive-mode graph queries scoped to their own
# collection, computed by the GATED run_eval_suite path (lancedb_root active):
# code-chunking/code-defref are ingested through a SEPARATE real pipeline with
# the calibrated ASTChunker(chunk_size=65) + real DefRefExtractor + GraphStore
# wired (see runner.py's _build_code_lane_ingest_pipeline), not the
# stub/default-chunker path used by every other eval collection.
#
# Config-lint non-vacuity (mirrors BE-8's synonym_bridge_recall_at_5 pattern):
# code_defref_recall_at_5's floor=1.0 sits strictly above the measured
# no-feature baseline of 0.6667 (the DEFAULT, non-code-lane eval path — no
# lancedb_root, so code-defref is ingested via the plain stub pipeline instead
# of the real code-lane pipeline — i.e. no AST chunker, no DefRefExtractor, no
# graph edges). The no-feature baseline misses the lexically-weak grade-2 gold
# doc (code-defref-notification-service) and only recovers the two
# lexically-trivial grade-1 docs (2/3 = 0.6667); the real-feature run recovers
# all three (3/3 = 1.0) via the calls edge (NotificationService.send ->
# validate_token). A regression that disables DefRefExtractor wiring on this
# path reproduces the 0.6667 baseline and fails this floor. See
# tests/eval/test_e2e_graph_eval_gate_v2.py's test_eval_gate_code_defref_recall_at_5
# for the enforced assertion. NOTE: this floor>baseline comparison is a
# config-lint guard only, not the primary non-vacuity proof — the true proof is
# the targeted weak-doc presence/absence assertion in that same test (C1-5),
# which isolates the one gold doc that genuinely requires the calls edge.
#
# code_chunking_recall_at_5 is REPORT-ONLY (no gated floor) — Cycle 2 finding
# C2-1/C2-7: on the committed corpus, at the calibrated chunk_size=65, the
# real-feature gated path (AST chunker) and the no-feature default path
# (chunk_size=256, plain Chonkie chunker) BOTH retrieve order_pipeline.py in
# the top-5 (1.0 vs 1.0) — the two arms differ in more than just chunking
# strategy (different chunk_size, different pipeline construction entirely),
# so a floor comparing them cannot discriminate an AST-chunker regression.
# Recalibrating the committed corpus text (now mirroring the mini-fixture
# design used by the non-vacuity unit test, verified empirically to diverge
# 1.0 AST vs 0.0 fixed-window when both arms use chunk_size=65 head-to-head)
# does not fix this: the gated-vs-no-feature comparison is structurally
# apples-to-oranges regardless of corpus content. AST-vs-fixed-window
# non-vacuity is proven instead by test_codeChunkingRecall_nonVacuous, which
# runs both arms through the SAME chunk_size=65 pipeline construction (only
# the chunker differs) — the only comparison that actually isolates the
# chunking-strategy signal. See that test's docstring and the metric's
# docstring in archon_search/eval/types.py for details.
code_defref_recall_at_5 = 1.0
# graph_ppr_bridge_recall_at_5 / graph_ppr_negative_control_recall_at_5:
# calibrated 2026-07-11 (BE-9).  PPR queries use graph_mode="ppr" which falls
# back to hybrid search when no PPRWalker is wired (the default run_eval_suite
# path — no lancedb_root, no PPR walker).  Floors set conservatively above 0.0
# to satisfy the config-lint non-vacuity guard (floor > no_graph_baseline = 0.0).
# The real non-vacuity proof is test_pprEvalGate_nonVacuous_pprOutperformsNoGraph
# in tests/eval/test_ppr_eval_gate.py, which constructs a dedicated PPR pipeline
# with a real PPRWalker and asserts strict inequality vs no-graph hybrid.
graph_ppr_bridge_recall_at_5 = 1.0
graph_ppr_negative_control_recall_at_5 = 1.0

[multilingual]
# Per-language recall floors for C2 multilingual eval fixtures.
# Values derived from calibration run with deterministic SHA-256 eval backend.
# Calibrated on: fr-docs collection, 5 French documents, 5 retrieval queries.
# Before C2 (English-only baseline): fr-docs queries not present.
# After C2 (with fr-docs, 38 queries / 62 docs): recall@5 on fr-docs = 1.0
#
# These are per-language sub-corpus floors, separate from the overall [quality_floors].
# A regression on French-only queries would show up here before the global recall@5 drops.
recall_at_5_fr = 1.0

[policy]
# Floors lowered more than this delta below the measured baseline require a
# reviewed waiver entry in baseline.json under "waiver_ids".
max_floor_drop_without_waiver = 0.05

# ---------------------------------------------------------------------------
# [search_baseline] — empirical p50/p95 recorded during Task 6.2 calibration
# Corpus: 500 chunks, DIM=32, 100 iterations, in-process LanceDB (stub embedder)
# Platform: darwin / Python 3.13, aarch64
#
#   unfiltered:     p50 = 2.2 ms   p95 = 2.4 ms
#   glob-filtered:  p50 = 2.7 ms   p95 = 2.9 ms   (source_path_glob ~20 % match)
#   prefix-filtered:p50 = 2.5 ms   p95 = 2.7 ms   (source_path_prefix ~20 % match)
#
# Threshold formula: p95_ms_glob_filtered = min(ceil(baseline_p95 * 1.67), 250)
#                  = min(ceil(2.9 * 1.67), 250) = min(5, 250) = 5
# ---------------------------------------------------------------------------

[search_filtered]
# Absolute p95 ceiling (ms) for glob-filtered hybrid search (source_path_glob, ~20 % match).
# Measurements use CPU time (time.process_time / CLOCK_PROCESS_CPUTIME_ID), NOT
# wall-clock, so the ceiling is robust to xdist sibling-worker contention.
# Serial CPU-time baseline: ~3-4 ms p95. Ceiling = 25 ms (~7× headroom, room for
# slower CI CPUs). Catches catastrophic regressions (accidental sync I/O, per-query
# model load) and meaningful algorithmic slowdowns.
p95_ms_glob_filtered = 25

# Maximum allowed p95 regression (percent) for prefix-filtered vs unfiltered baseline.
# Both measured in the same run using CPU time. Real SQL LIKE overhead is ~15-18 %.
# Empirical CPU-time delta on darwin/aarch64 under full parallel load: 30-45 %.
# 75 % ceiling gives clear margin above observed jitter while still catching a
# near-doubling-of-cost regression.
p95_regression_pct_prefix_vs_unfiltered = 75

# ---------------------------------------------------------------------------
# [search_hyde_false] — latency regression guard for HyDE fast-path (hyde=False)
# Purpose: confirm that resolve_hyde_vector(hyde=False) adds no measurable overhead
# to unfiltered hybrid search. The ceiling is set equal to [search_filtered].p95_ms_glob_filtered
# because if HyDE is disabled the hot path is identical to an unfiltered search.
# ---------------------------------------------------------------------------

[search_hyde_false]
# Absolute p95 ceiling (ms) for hyde=false hybrid search (fast-path, no generator call).
# Measured in CPU time (time.process_time). Serial baseline: ~3 ms p95.
# Ceiling = 25 ms (~8× headroom for CI CPU variance).
p95_ms = 25

# ---------------------------------------------------------------------------
# [search_rag_fusion_disabled] — latency regression guard for RAG Fusion disabled path
# Purpose: confirm that rag_fusion=False adds no measurable overhead over unfiltered
# hybrid search (zero overhead for callers who do not opt in to RAG Fusion).
# ---------------------------------------------------------------------------

[search_rag_fusion_disabled]
# Absolute p95 ceiling (ms) for rag_fusion=false hybrid search (fast path, no generator call).
# Guards that the rag_fusion=False path adds zero overhead.
# Measured in CPU time (time.process_time). Serial baseline: ~5 ms p95.
# Ceiling = 50 ms (~10× headroom for CI CPU variance and pipeline-wrapper overhead).
p95_ms = 50

# ---------------------------------------------------------------------------
# [search_rag_fusion_enabled] — latency regression guard for RAG Fusion enabled path
# Purpose: confirm the mocked RAG Fusion path (no real LLM, no embedding) completes within
# an acceptable ceiling. Set to ≤3× the disabled-path ceiling.
# ---------------------------------------------------------------------------

[search_rag_fusion_enabled]
# Absolute p95 ceiling (ms) for rag_fusion=true hybrid search (mocked generator,
# N+1 hybrid_search calls but deterministic eval backend).
# Measured in CPU time (time.process_time). Serial baseline: ~6 ms p95.
# Ceiling = 100 ms (~17× headroom — RAG fusion enabled has N+1 hybrid_search calls
# and async fan-out variance, plus CI CPU variance).
p95_ms = 100

# ---------------------------------------------------------------------------
# [ingest_latency] — C6 incremental FTS regression guard
# Purpose: confirm that ingest_file on a large corpus (≥1,000 chunks) completes
# in O(delta-size) time, not O(collection-size). A pre-C6 rebuild_fts_index on
# 1,000 chunks takes materially longer than a post-C6 optimize_fts on 5–10 new chunks.
#
# CALIBRATION: measured p95 on darwin/aarch64 with EvalEmbedderBackend, 1,000-chunk
# corpus, ~3-chunk delta doc:
#   baseline: ~46 ms p95 (7 iterations, 2026-06-09, Python 3.12)
#   formula:  ceil(46 * 1.5) = 69 ms (hard cap: 2000 ms)
#   CI headroom: 500 ms (conservative; GH Actions ubuntu-latest ~2-3× slower for I/O)
#
# DECISION (C6 Task 5.1): promoted to a HARD gate — C6's O(delta) guarantee is
# meaningless if a regression silently reverts to O(collection-size) ingest cost.
# See Documentation/Backlog/C6-incremental-fts-maintenance-brief.md Open Questions.
# ---------------------------------------------------------------------------

[ingest_latency]
# Absolute p95 ceiling (ms) for ingest_file on a 1,000-chunk corpus.
# Hard gate: a regression above this ceiling fails the eval run.
# baseline: ~46 ms on darwin/aarch64 (EvalEmbedderBackend, 3-chunk delta, 2026-06-09)
# formula: ceil(measured_p95_ms * 1.5) = 69 ms; CI ceiling: 500 ms
single_file_p95_ms = 500
