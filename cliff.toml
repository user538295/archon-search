[changelog]
header = ""
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits | filter(attribute="group", value="Features") %}{% if loop.first %}**{{ commit.message | split(pat=": ") | last | capitalize }}**

{% endif %}{% endfor %}{% for commit in commits %}- {{ commit.message | split(pat=": ") | last | capitalize }}
{% endfor %}"""
trim = true

[git]
tag_pattern = "^\\d+\\.\\d+\\.\\d+$"
skip_tags = ""
sort_commits = "oldest"

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = ".*", skip = true },
]
