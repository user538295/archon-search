name: Live Eval

on:
  push:
    tags:
      - "*"
  workflow_dispatch: {}

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The live-lane snapshot directories of <ARCHON_SEARCH_DATA_DIR>/models (default
          # ~/.archon-search). The key names the pinned revisions (archon_search/model_specs.py);
          # tests/test_workflow_model_cache_lint.py enforces it.
          path: |
            ~/.archon-search/models/models--BAAI--bge-small-en-v1.5
            ~/.archon-search/models/models--cross-encoder--ms-marco-MiniLM-L-6-v2
          key: model-cache-live-bge-small-en-v1.5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a-ms-marco-MiniLM-L-6-v2-233902d25c440f23af6f7d6e94d2946bac0bee0a

      - name: Install dependencies
        run: uv sync --dev

      - name: Prefetch models (3 attempts, exponential backoff)
        # model_store.ensure_model at the pinned revisions into <ARCHON_SEARCH_DATA_DIR>/models,
        # the directory the live lane's backends load from (a no-op on a cache hit).
        run: |
          prefetch_ok=false
          for attempt in 1 2 3; do
            uv run python -m tests._live_model_cache && { prefetch_ok=true; break; }
            echo "Attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$prefetch_ok" != "true" ]; then
            echo "All prefetch attempts failed"; exit 1
          fi

      - name: Run live eval suite
        continue-on-error: true
        run: uv run pytest -o addopts= --strict-markers -m live_eval tests/eval/live/ -v --no-cov

      - name: Upload live eval report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-eval-report
          path: tests/eval/live_baselines/_artifacts/
          if-no-files-found: warn
