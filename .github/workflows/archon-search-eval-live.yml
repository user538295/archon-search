name: Live Eval

on:
  push:
    tags:
      - "*"
  workflow_dispatch: {}

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Cache model weights
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub/
            ~/.cache/fastembed/
          key: fastembed-${{ hashFiles('uv.lock') }}-${{ runner.os }}
          restore-keys: |
            fastembed-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run live eval suite
        continue-on-error: true
        run: uv run pytest -o addopts= --strict-markers -m live_eval tests/eval/live/ -v --no-cov

      - name: Upload live eval report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: live-eval-report
          path: tests/eval/live_baselines/_artifacts/
          if-no-files-found: warn
