name: archon-search PR gate

# PR gate for the archon-search standalone repo. Runs the default test suite
# and the gated eval slice with combined coverage, enforcing the coverage
# fail-under floor before merge. Triggers on every pull request — no path
# filter needed because the whole repo is archon-search.

on:
  pull_request:
  workflow_dispatch:  # enables manual trigger for threshold calibration runs

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    # Step timeouts sum to ~178 min (45 docling + ...); this is comfortably above that,
    # same reasoning as archon-search-release.yml's test job (mirror it if either drifts).
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # setuptools-scm / hatch-vcs need the full history to compute version
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Clean install (uv sync --dev)
        run: uv sync --dev

      - name: Verify pytest-cov plugin is importable
        run: uv run python -c "import pytest_cov"

      - name: Restore fastembed + HuggingFace model cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          # Update the key suffix (v1→v2 etc.) if model names change, or if a new step
          # populates these directories — the docling lane below pulls the layout/TableFormer
          # and RapidOCR weights into ~/.cache/huggingface, and an exact hit on the old key
          # never re-saves, so every run would re-download them.
          key: model-cache-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-docling-v2
          restore-keys: model-cache-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-

      - name: Prefetch models (3 attempts, exponential backoff)
        run: |
          prefetch_ok=false
          for attempt in 1 2 3; do
            uv run python -c "
          from fastembed import TextEmbedding
          from fastembed.rerank.cross_encoder import TextCrossEncoder
          TextEmbedding('BAAI/bge-small-en-v1.5')
          TextCrossEncoder('Xenova/ms-marco-MiniLM-L-6-v2')
          print('Models prefetched')
          " && { prefetch_ok=true; break; }
            echo "Attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$prefetch_ok" != "true" ]; then
            echo "All prefetch attempts failed"; exit 1
          fi

      - name: Run default suite with coverage (no fail-under)
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append -n0 -m "not live and not eval and not benchmark and not integration and not live_eval and not live_benchmark and not docling and not graph_real_artifact"

      - name: Run eval slice with thresholds, coverage append, runxfail
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append --runxfail -m eval --thresholds-path tests/eval/thresholds.toml tests/eval/

      - name: Create disk-backed basetemp for integration tests
        # GitHub Actions' default /tmp is tmpfs; the crash-injection integration
        # tests skip on tmpfs, so they need a disk-backed basetemp to actually run.
        run: mkdir -p /var/tmp/archon-search-it

      - name: Run integration suite on disk-backed basetemp, coverage append
        run: uv run pytest --basetemp=/var/tmp/archon-search-it -o addopts= --strict-markers --strict-config --cov=archon_search --cov-append -m "integration and not eval and not docling and not graph_real_artifact" tests/

      - name: Run docling parser lane
        # The `transformers` constraint in [tool.uv] constraint-dependencies steps down a
        # BASE dependency: docling pulls torch/transformers, so a resolver change there can
        # break real PDF/OCR parsing without a single unit test noticing. The unit and
        # integration steps above both filter the lane out (`not docling`), so this step is
        # the only place it runs. A tag can be cut from a commit that never met the PR gate
        # (release.sh checks branch/tree/origin, never CI status), so the release workflow
        # runs it too — the same reasoning as GRAPH-4 for the real-artifact lane below.
        timeout-minutes: 45
        run: uv run pytest -o addopts= --strict-markers --strict-config --no-cov -n0 -m docling --junitxml=docling-results.xml tests/

      - name: Verify docling tests ran (not just skipped)
        # tests/integration/test_http_enrichment_metadata.py's two lane tests pytest.skip()
        # when a PDF/image ingest fails or times out — deliberate, those paths are slow and
        # flaky on a shared runner. The other 6 docling-marked tests never skip (they
        # pytest.fail on error), so an aggregate tests-skips>0 check is always satisfied by
        # those 6 alone and can never catch the two skip-prone tests going silently green
        # with no real OCR exercised. Name the two testcases explicitly instead, mirroring
        # the graph_real_artifact lane's "verify the blocking non-vacuity test" step below.
        run: uv run python -c "import xml.etree.ElementTree as ET; cases=dict((c.get('name'), c) for c in ET.parse('docling-results.xml').getroot().iter('testcase')); names=['test_pdf_page_number_in_search_response','test_image_file_assigns_page_start_one']; missing=[n for n in names if n not in cases]; assert not missing, f'expected docling testcases not found - {missing} - the lane did not run, check the prefetch step'; skipped=[n for n in names if cases[n].find('skipped') is not None]; assert not skipped, f'docling testcases skipped, no real OCR exercised - {skipped}'"

      - name: Run real-model latency benchmark
        timeout-minutes: 3
        run: uv run pytest -o addopts= --strict-markers --strict-config --no-cov -n0 -m live_benchmark --junitxml=benchmark-results.xml tests/eval/live_benchmark/

      - name: Verify benchmark tests ran (not just skipped)
        # pytest's default junit_family=xunit2 puts tests/skipped on the <testsuite> CHILD,
        # not the <testsuites> root find() returns — reading the root's own .attrib always
        # returns the int(...) defaults (0), so `tests-skips>0` was always False here.
        run: uv run python -c "import xml.etree.ElementTree as ET; t=ET.parse('benchmark-results.xml').getroot(); ts=t.find('testsuite'); t=ts if ts is not None else t; tests=int(t.attrib.get('tests',0)); skips=int(t.attrib.get('skipped',0)); assert tests-skips>0, f'All {tests} benchmark tests were skipped or none ran — check model cache prefetch step'"

      - name: Restore graph NER artifact cache
        uses: actions/cache@v6.1.0
        with:
          # ProseExtractionBackend passes get_graph_models_dir() as GLiNER's cache_dir,
          # which resolves under ARCHON_SEARCH_DATA_DIR (default ~/.archon-search) —
          # archon_search/paths.py get_data_dir()/get_graph_models_dir().
          path: ~/.archon-search/models/graph
          # The key pins GRAPH_NER_MODEL_NAME + GRAPH_NER_MODEL_REVISION
          # (archon_search/paths.py). Update it whenever either changes.
          key: graph-ner-knowledgator-gliner-relex-multi-v1.0-e990d9ba6f471b846f7d78bf7e4b4dab11761ada
          restore-keys: graph-ner-knowledgator-gliner-relex-multi-v1.0-

      - name: Prefetch graph NER artifact (3 attempts, linear backoff)
        run: |
          prefetch_ok=false
          for attempt in 1 2 3; do
            uv run python -c "
          import asyncio
          from archon_search.prose_extraction_backend import ProseExtractionBackend
          backend = ProseExtractionBackend()
          asyncio.run(backend.load())
          assert backend.load_count == 1, backend.load_count
          print('Graph NER artifact prefetched')
          " && { prefetch_ok=true; break; }
            echo "Attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$prefetch_ok" != "true" ]; then
            echo "All prefetch attempts failed"; exit 1
          fi

      - name: Run graph real-artifact lane
        # --no-cov mirrors the live_benchmark step: tests/CLAUDE.md reserves --cov-append
        # across separate invocations for the release workflow's -n0 accumulation.
        # ARCHON_SEARCH_DATA_DIR is explicit because tests/conftest.py's autouse fixture
        # otherwise redirects it at a throwaway per-worker dir, which would send
        # GLiNER.from_pretrained past the cache restored above and re-download the model.
        # $HOME/.archon-search is the same path the cache and prefetch steps above use
        # (it is get_data_dir()'s own default, which those two steps rely on).
        # tests/ (not the single lane file): T-9 and T-10 both landed in that same file,
        # but scoping by marker alone (matching the eval/integration steps above) means a
        # lane test that ends up elsewhere still runs and is still verified below.
        # The budget must exceed the tests' OWN caps so a real overrun is reported by the
        # test (with its RSS trace) rather than killed opaquely by the step. The real sum,
        # recounted at T-10 because every earlier figure here undercounted it:
        #   non-vacuity      900s  (_RUN_BUDGET_S, between-batch wall-clock check)
        #   memory budget    900s  (same)
        #   throughput      2700s  (_THROUGHPUT_RUNS=3 x asyncio.timeout(_RUN_BUDGET_S) —
        #                          the cap is PER RUN, inside the loop, not per test; this
        #                          is the dominant term and predates T-10)
        #   determinism     1200s  (2 child processes x _SMALL_RUN_BUDGET_S=600s)
        #   French          1200s  (2 capped awaits x _SMALL_RUN_BUDGET_S)
        #                = 6900s = 115 minutes, plus uncapped model loads and warm-ups.
        # 130 covers it. A ceiling, not an expectation: a healthy run is ~5 minutes.
        timeout-minutes: 130
        run: ARCHON_SEARCH_DATA_DIR="$HOME/.archon-search" uv run pytest -o addopts= --strict-markers --strict-config --no-cov -n0 -m graph_real_artifact --junitxml=graph-real-artifact-results.xml tests/

      - name: Verify the blocking non-vacuity test actually ran
        # Asserts on THAT test by name, not an aggregate count: the lane's memory-budget
        # test is xfail-marked, and xunit2 records an xfail as <skipped type="pytest.xfail">
        # while a non-strict XPASS records as passed — so `tests-skipped>0` can be satisfied
        # entirely by the soft test while the blocking one never ran. Naming it closes that
        # hole for this test only; the lane's three OTHER blocking tests are not covered
        # here — see TEST-4 in Documentation/Architecture/530_technical_debt_refactoring_roadmap.md.
        run: uv run python -c "import xml.etree.ElementTree as ET; c=[t for t in ET.parse('graph-real-artifact-results.xml').getroot().iter('testcase') if t.get('name')=='test_graph_ner_lane_non_vacuity']; assert len(c)==1, f'expected exactly one test_graph_ner_lane_non_vacuity testcase, found {len(c)} — the lane did not run; check the prefetch step'; assert c[0].find('skipped') is None, 'test_graph_ner_lane_non_vacuity was skipped — the real-artifact guard did not execute'"

      - name: Enforce coverage fail-under=85
        # The three --cov pytest steps (default suite, eval slice, integration suite)
        # all use --cov-append, which writes to a single .coverage file — the docling,
        # live_benchmark and graph real-artifact steps between them use --no-cov and
        # don't touch it. There is no parallel-mode shard set to merge, so we skip
        # `coverage combine` (it would error with "No data to combine") and report
        # directly on the single file.
        run: uv run coverage report --fail-under=85

      - name: Verify 100% coverage of _durable_io.py
        run: uv run coverage report --fail-under=100 --include=archon_search/_durable_io.py
