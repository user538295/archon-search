name: archon-search runtime bench

# CPU throughput gate of ADR 18 (Documentation/Backlog/pytorch-runtime-plan.md, Task 6.1): the ten
# profile models through the PyTorch runtime and through fastembed 0.9.0 on the same texts, one job
# per OS, in ONE process that alternates the two runtimes run by run (best of 10 each), so a load burst
# on the runner hits both and the ratio stays comparable. The job fails when any model's torch
# throughput is below 0.9x fastembed's. This is the only place fastembed still runs: it is the
# comparison baseline, installed ad hoc via `uv run --with`.

on:
  workflow_dispatch:

jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm / hatch-vcs need the full history to compute version
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the project (uv sync)
        run: uv sync

      - name: Benchmark PyTorch and the fastembed baseline, interleaved (CPU)
        run: uv run --with fastembed==0.9.0 python scripts/bench_runtime.py --runtime both --output both.json

      - name: Compare (fails the job when torch < 0.9x fastembed on any model)
        run: uv run python scripts/bench_runtime.py compare both.json > table.md

      - name: Write job summary
        if: always()
        run: |
          if [ -f table.md ]; then
            cat table.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-bench-${{ matrix.os }}
          path: |
            table.md
            both.json
          if-no-files-found: warn
