name: Fix release notes (one-time)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-release-notes.yml', '.github/scripts/publish_release_notes.py']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_release_notes.py
