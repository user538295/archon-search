name: archon-search release

# Manual-only release. The workflow runs only on tag push (created by
# `release.sh`) or on `workflow_dispatch:`. Plain pushes to `main` do not
# trigger anything here — PR runs are handled by `archon-search-pr.yml`.
#
# Tag format: YY.M.<git-rev-list-count> (computed by release.sh).
# Hatch-vcs reads the tag from the checkout and stamps the wheel filename
# with it; the workflow refuses to publish if the wheel version drifts
# from the tag name.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — eval gate (must pass before publish runs)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Clean install (uv sync --dev)
        run: uv sync --dev

      - name: Verify pytest-cov plugin is importable
        run: uv run python -c "import pytest_cov"

      - name: Run default suite with coverage (no fail-under)
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append -m "not live and not eval and not benchmark and not integration"

      - name: Run eval slice with thresholds, coverage append, runxfail
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append --runxfail -m eval --thresholds-path tests/eval/thresholds.toml tests/eval/

      - name: Enforce coverage fail-under=85
        run: uv run coverage report --fail-under=85

  # ---------------------------------------------------------------------------
  # Job 2 — build + publish to PyPI (OIDC, no stored secrets)
  # The tag was created and pushed by release.sh before this workflow ran.
  # ---------------------------------------------------------------------------
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token for PyPI's trusted publisher.
      id-token: write
    steps:
      - name: Checkout (at the tag)
        uses: actions/checkout@v4
        with:
          # Need full history so hatch-vcs / setuptools-scm can resolve the
          # version from the tag we are currently on.
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          # On `push: tags:` the ref is refs/tags/<tag>; on workflow_dispatch
          # we expect to be invoked from a tag checkout too.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            # workflow_dispatch path — derive from describe
            TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a tag. Run release.sh and let it push a tag, or invoke this workflow against a tag ref."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install hatch
        run: uv tool install hatch

      - name: Build wheel + sdist
        run: |
          uv tool run hatch build --clean
          ls -la dist/

      - name: Verify wheel version matches the pushed tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/archon_search-*.whl)
          WHEEL_VER=$(basename "$WHEEL" | sed -E 's/^archon_search-([^-]+)-.*/\1/')
          echo "wheel version: $WHEEL_VER"
          echo "pushed tag   : $TAG"
          if [ "$WHEEL_VER" != "$TAG" ]; then
            echo "::error::Wheel version '$WHEEL_VER' does not match tag '$TAG' — refusing to publish."
            exit 1
          fi

      - name: Publish to PyPI (OIDC, no stored secrets)
        uses: pypa/gh-action-pypi-publish@release/v1
