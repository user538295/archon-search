name: archon-search release

# Manual-only release. The workflow runs only on tag push (created by
# `release.sh`) or on `workflow_dispatch:`. Plain pushes to `main` do not
# trigger anything here — PR runs are handled by `archon-search-pr.yml`.
#
# Tag format: YY.M.<git-rev-list-count> (computed by release.sh).
# Hatch-vcs reads the tag from the checkout and stamps the wheel filename
# with it; the workflow refuses to publish if the wheel version drifts
# from the tag name.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — eval gate (must pass before publish runs)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Clean install (uv sync --dev)
        run: uv sync --dev

      - name: Verify pytest-cov plugin is importable
        run: uv run python -c "import pytest_cov"

      - name: Run default suite with coverage (no fail-under)
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append -m "not live and not eval and not benchmark and not integration and not live_eval"

      - name: Run eval slice with thresholds, coverage append, runxfail
        run: uv run pytest -o addopts= --strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-append --runxfail -m eval --thresholds-path tests/eval/thresholds.toml tests/eval/

      - name: Enforce coverage fail-under=85
        run: uv run coverage report --fail-under=85

  # ---------------------------------------------------------------------------
  # Job 2 — build + publish to PyPI (OIDC, no stored secrets)
  # The tag was created and pushed by release.sh before this workflow ran.
  # ---------------------------------------------------------------------------
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token for PyPI's trusted publisher.
      id-token: write
    steps:
      - name: Checkout (at the tag)
        uses: actions/checkout@v4
        with:
          # Need full history so hatch-vcs / setuptools-scm can resolve the
          # version from the tag we are currently on.
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          # On `push: tags:` the ref is refs/tags/<tag>; on workflow_dispatch
          # we expect to be invoked from a tag checkout too.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            # workflow_dispatch path — derive from describe
            TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a tag. Run release.sh and let it push a tag, or invoke this workflow against a tag ref."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install hatch
        run: uv tool install hatch

      - name: Build wheel + sdist
        run: |
          uv tool run hatch build --clean
          ls -la dist/

      - name: Verify wheel version matches the pushed tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/archon_search-*.whl)
          WHEEL_VER=$(basename "$WHEEL" | sed -E 's/^archon_search-([^-]+)-.*/\1/')
          echo "wheel version: $WHEEL_VER"
          echo "pushed tag   : $TAG"
          if [ "$WHEEL_VER" != "$TAG" ]; then
            echo "::error::Wheel version '$WHEEL_VER' does not match tag '$TAG' — refusing to publish."
            exit 1
          fi

      - name: Publish to PyPI (OIDC, no stored secrets)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout (at tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Derive tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section body
        id: notes
        run: |
          NOTES=$(awk '/^## /{if(found) exit; found=1; next} found' CHANGELOG.md)
          delimiter="NOTES_$(openssl rand -hex 8)"
          echo "notes<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        run: |
          DL_URL=$(curl -s "https://api.github.com/repos/orhun/git-cliff/releases/latest" \
            | jq -r '.assets[] | select(.name | endswith("x86_64-unknown-linux-musl.tar.gz")) | .browser_download_url')
          curl -sSfL "$DL_URL" | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/git-cliff'
          chmod +x /usr/local/bin/git-cliff

      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update GitHub Release for current tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          payload=$(jq -n --arg tag "$TAG" --arg body "$NOTES" \
            '{tag_name: $tag, name: $tag, body: $body, make_latest: "true"}')
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          if [ "$http_code" = "422" ]; then
            code=$(echo "$body" | jq -r '.errors[0].code // empty' 2>/dev/null || echo "")
            if [ "$code" = "already_exists" ]; then
              echo "Release already exists — idempotent exit."
              exit 0
            fi
          fi
          if [ "$http_code" != "201" ]; then
            echo "GitHub API error $http_code: $body" >&2
            exit 1
          fi
          echo "GitHub Release created: $(echo "$body" | jq -r '.html_url')"

      - name: Backfill release notes for all previous releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(git tag | sort -V)
          releases=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")

          echo "$releases" | jq -r '.[] | "\(.tag_name) \(.id)"' | while read -r tag rid; do
            for i in "${!TAGS[@]}"; do
              [[ "${TAGS[$i]}" == "$tag" ]] || continue
              if [[ $i -eq 0 ]]; then
                range="${TAGS[0]}"
              else
                range="${TAGS[$((i-1))]}..${TAGS[$i]}"
              fi
              notes=$(git-cliff $range --tag "$tag" 2>/dev/null \
                | awk '/^## /{if(found) exit; found=1; next} found')
              [[ -z "$notes" ]] && echo "Skipping $tag (empty)" && break
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -X PATCH "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$rid" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "$(jq -n --arg b "$notes" '{body: $b, make_latest: "false"}')")
              echo "Backfilled $tag: HTTP $code"
              break
            done
          done
