name: archon-search runtime parity

# Real-weights parity of the PyTorch embedder and reranker against the frozen reference outputs in
# tests/fixtures/runtime_parity/ (ADR 18, Tasks 4.3 and 5.3), on the CPU of a GitHub-hosted runner.
# The lane downloads every profile model (~5 GB) into a fresh data directory on each run, so it is
# not a PR gate: it runs nightly and on demand. Locally the same invocation is documented in the
# module docstrings of tests/runtime_parity/.

on:
  schedule:
    - cron: "41 3 * * *"  # daily, 03:41 UTC (off the top of the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm / hatch-vcs need the full history to compute version
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run runtime parity lane (CPU)
        # ARCHON_RUNTIME_PARITY_DATA_DIR is the data directory whose models/ holds the pinned snapshots; missing ones
        # are downloaded on first use. It is set here from $RUNNER_TEMP, not in a job-level `env`: the `runner`
        # context is unavailable there, and GitHub rejects the whole file ("Unrecognized named-value: 'runner'").
        # -o addopts= drops the default -n 8 / coverage / -m filter; -rP prints the measured worst
        # cosine per model.
        run: >-
          ARCHON_RUNTIME_PARITY_DATA_DIR="$RUNNER_TEMP/runtime-parity"
          uv run pytest -m runtime_parity tests/runtime_parity/ --no-cov -q -p no:cacheprovider -o addopts= -rP
