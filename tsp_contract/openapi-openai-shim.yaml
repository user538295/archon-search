openapi: 3.0.0
info:
  title: Archon OpenAI Shim — Chat Completions API
  version: 0.0.0
tags: []
paths:
  /v1/chat/completions:
    post:
      operationId: ChatCompletions_create
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ChatCompletionResponse'
                  - $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: Service unavailable. The collection list or the collection metadata could not be read, the search failed unexpectedly, or the embedder load did not finish within the cache's own 120 s wait (this last case adds a Retry-After header of 30 seconds; it is a defensive mapping, because the search stops waiting for the embedder after 0.5 s and answers from the FTS leg, so a client does not meet it with the shipped cache). The body is the OpenAI error envelope with message "Service temporarily unavailable." and type "server_error"; no exception text.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before retrying; present only when the embedder is not ready.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
components:
  schemas:
    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
          format: int32
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
    ChatCompletionChunk:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int32
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkChoice'
    ChatCompletionChunkChoice:
      type: object
      required:
        - index
        - delta
        - finish_reason
      properties:
        index:
          type: integer
          format: int32
        delta:
          $ref: '#/components/schemas/ChunkDelta'
        finish_reason:
          type: string
          nullable: true
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: OpenAI model name — "archon-search" or "archon-search/{collection}"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          nullable: true
        top_k:
          type: integer
          format: int32
          nullable: true
          description: Accepted for protocol compatibility and ignored for any integer, in or out of range, and never answered with a 4xx. A non-integer value is the generic 422 of a malformed body field. The number of result chunks is the operator's [openai_shim].top_k when set, else [database].top_k_return.
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int32
        model:
          type: string
          description: Echoes the requested model name
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          $ref: '#/components/schemas/ChatCompletionUsage'
    ChatCompletionUsage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          format: int32
        completion_tokens:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int32
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
        content:
          type: string
    ChunkDelta:
      type: object
      properties:
        role:
          type: string
          description: Only present on the first chunk
        content:
          type: string
    OpenAIError:
      type: object
      required:
        - message
        - type
      properties:
        message:
          type: string
        type:
          type: string
        param:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
    OpenAIErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/OpenAIError'
