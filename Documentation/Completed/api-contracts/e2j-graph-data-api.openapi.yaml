openapi: 3.0.0
info:
  title: 'Graph Data API — E2j: entity_type field added to node response'
  version: 0.0.0
tags: []
paths:
  /graph/{collection}:
    get:
      operationId: GraphData_get
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - graphml
          explode: false
        - name: salience
          in: query
          required: false
          schema:
            type: string
            enum:
              - frequency
              - tfidf
              - importance
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphInspectionResponse'
components:
  schemas:
    EntityType:
      type: string
      enum:
        - person
        - concept
        - system
        - event
        - code_symbol
      description: Entity types the graph recognises.
    GraphEdgeResponse:
      type: object
      required:
        - edge_id
        - source_entity_id
        - target_entity_id
        - weight
        - source_chunk_ids
        - relationship_type
      properties:
        edge_id:
          type: string
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        weight:
          type: integer
          format: int32
          description: Co-occurrence chunk count; maps to edge thickness in the viewer.
        source_chunk_ids:
          type: array
          items:
            type: string
          description: Up to 20 chunk IDs where both endpoints co-occur.
        relationship_type:
          type: string
          description: Defaults to "related_to". Use for hover tooltip in the viewer.
      description: A single graph edge returned by GET /graph/{collection}.
    GraphInspectionResponse:
      type: object
      required:
        - nodes
        - edges
        - truncated
        - node_count
        - edge_count
        - salience_mode
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNodeResponse'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdgeResponse'
        truncated:
          type: boolean
          description: True when node_count > displayed nodes or edge_count > displayed edges.
        node_count:
          type: integer
          format: int32
          description: Total nodes before truncation cap.
        edge_count:
          type: integer
          format: int32
          description: Edges where both endpoints survive the node filter, before edge cap.
        salience_mode:
          type: string
          enum:
            - frequency
            - tfidf
            - importance
    GraphNodeResponse:
      type: object
      required:
        - entity_id
        - entity_name
        - entity_type
        - chunk_count
        - salience
      properties:
        entity_id:
          type: string
        entity_name:
          type: string
        entity_type:
          type: string
          description: Added in E2j. Corresponds to EntityType enum values in graph_types.py.
        chunk_count:
          type: integer
          format: int32
        salience:
          type: number
          format: double
        pagerank_score:
          type: number
          format: double
          nullable: true
      description: A single graph node returned by GET /graph/{collection}.
