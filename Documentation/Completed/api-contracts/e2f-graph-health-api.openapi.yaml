openapi: 3.0.0
info:
  title: E2f Graph Health API
  version: 0.0.0
tags: []
paths:
  /graph/{collection}:
    get:
      operationId: GraphInspection_inspect
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphInspectionResponse'
  /status:
    get:
      operationId: Status_get
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphStatusResponse'
components:
  schemas:
    GraphCollectionStats:
      type: object
      required:
        - collection
        - node_count
        - edge_count
        - communities_invalidated
      properties:
        collection:
          type: string
        node_count:
          type: integer
          format: int32
        edge_count:
          type: integer
          format: int32
        communities_invalidated:
          type: boolean
        synonym_edge_count:
          type: integer
          format: int32
        singleton_node_pct:
          type: number
          format: double
        synonym_link_rate:
          type: number
          format: double
        connected_component_count:
          type: integer
          format: int32
    GraphEdgeResponse:
      type: object
      required:
        - edge_id
        - source_entity_id
        - target_entity_id
        - weight
        - source_chunk_ids
      properties:
        edge_id:
          type: string
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        weight:
          type: integer
          format: int32
        source_chunk_ids:
          type: array
          items:
            type: string
        relationship_type:
          type: string
    GraphInspectionResponse:
      type: object
      required:
        - nodes
        - edges
        - node_count
        - edge_count
        - truncated
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNodeResponse'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdgeResponse'
        node_count:
          type: integer
          format: int32
        edge_count:
          type: integer
          format: int32
        truncated:
          type: boolean
    GraphNodeResponse:
      type: object
      required:
        - node_id
        - entity_name
        - entity_type
      properties:
        node_id:
          type: string
        entity_name:
          type: string
        entity_type:
          type: string
    GraphStatusDetail:
      type: object
      required:
        - enabled
        - backend_threshold_edges
        - stale_mention_count
        - collections
      properties:
        enabled:
          type: boolean
        backend_threshold_edges:
          type: integer
          format: int32
        stale_mention_count:
          type: integer
          format: int32
        collections:
          type: array
          items:
            $ref: '#/components/schemas/GraphCollectionStats'
    GraphStatusResponse:
      type: object
      properties:
        graph:
          type: object
          allOf:
            - $ref: '#/components/schemas/GraphStatusDetail'
          nullable: true
