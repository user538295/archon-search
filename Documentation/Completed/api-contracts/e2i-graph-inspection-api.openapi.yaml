openapi: 3.0.0
info:
  title: Graph Inspection API — E2i extension
  version: 0.0.0
tags: []
paths:
  /graph/{collection}:
    get:
      operationId: GraphInspection_get
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphInspectionResponse'
components:
  schemas:
    GraphEdgeResponse:
      type: object
      required:
        - sourceId
        - targetId
        - relationshipType
        - extractionMethod
      properties:
        sourceId:
          type: string
        targetId:
          type: string
        relationshipType:
          type: string
        extractionMethod:
          type: string
          nullable: true
    GraphInspectionResponse:
      type: object
      required:
        - nodes
        - edges
        - truncated
        - nodeCount
        - edgeCount
        - salienceMode
        - communitiesTotal
        - communitiesSummarized
        - unsummarizedCommunityIds
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNodeResponse'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdgeResponse'
        truncated:
          type: boolean
        nodeCount:
          type: integer
          format: int32
        edgeCount:
          type: integer
          format: int32
        salienceMode:
          type: string
          enum:
            - frequency
            - tfidf
            - importance
        communitiesTotal:
          type: integer
          format: int32
          description: Total number of communities for this collection.
        communitiesSummarized:
          type: integer
          format: int32
          description: Communities that have a non-null summary_text.
        unsummarizedCommunityIds:
          type: array
          items:
            type: string
          description: IDs of communities missing summary_text; capped at 100.
      description: Extended graph inspection response adding community-summary telemetry.
    GraphNodeResponse:
      type: object
      required:
        - nodeId
        - entityName
        - entityType
        - frequency
      properties:
        nodeId:
          type: string
        entityName:
          type: string
        entityType:
          type: string
        frequency:
          type: integer
          format: int32
