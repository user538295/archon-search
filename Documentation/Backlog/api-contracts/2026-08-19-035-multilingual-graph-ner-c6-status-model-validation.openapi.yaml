openapi: 3.0.0
info:
  title: Archon Search Status — Model Validation
  version: 0.0.0
tags: []
paths:
  /status:
    get:
      operationId: Status_status
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
components:
  schemas:
    ModelValidationStatus:
      type: object
      required:
        - embedder_ok
        - reranker_ok
        - llama_cpp_ok
        - provider_warnings
        - validated_at
      properties:
        embedder_ok:
          type: boolean
          nullable: true
        reranker_ok:
          type: boolean
          nullable: true
        llama_cpp_ok:
          type: boolean
          nullable: true
        provider_warnings:
          type: array
          items:
            type: string
        validated_at:
          type: string
          format: date-time
          nullable: true
    StatusResponse:
      type: object
      required:
        - model_validation
      properties:
        model_validation:
          $ref: '#/components/schemas/ModelValidationStatus'
