openapi: 3.0.0
info:
  title: Telemetry Stats API — truncation count (E0b L11)
  version: 0.0.0
tags: []
paths:
  /telemetry/stats:
    get:
      operationId: TelemetryStats_stats
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponseE0bExtension'
components:
  schemas:
    StatsResponseE0bExtension:
      type: object
      required:
        - truncated_count
      properties:
        truncated_count:
          type: integer
          format: int32
          description: >-
            L11: count of entries where result_doc_ids was truncated to fit MAX_ENTRY_BYTES.
            Count logic must use `entry.truncated is True` (identity check) — TelemetryEntry.truncated
            defaults to None (not False).
      description: >-
        E0b addition to StatsResponse (L11). Partial model — only the field added by E0b shown.
        Full StatsResponse in archon_search/server/schemas_telemetry.py.
        Implementers extend StatsResponse, not a new class.
