openapi: 3.0.0
info:
  title: 'Graph Viewer API — E2j: single-file interactive graph viewer endpoint'
  version: 0.0.0
tags: []
paths:
  /graph/{collection}/view:
    get:
      operationId: GraphViewer_view
      description: |-
        Render the interactive graph viewer for a collection.
              Requires Authorization: Bearer <token> header. The token is injected into
              the returned HTML so subsequent JS fetches are authenticated automatically.
              Must be declared before GET /graph/{collection} in routes_graph.py to
              prevent FastAPI from consuming "view" as the collection path parameter.
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Successful HTML response: a self-contained page with the viewer.'
          content:
            text/html:
              schema:
                type: string
                format: binary
        '401':
          description: Access is unauthorized.
        '404':
          description: The server cannot find the requested resource.
        '422':
          description: Graph feature is disabled (graph.enabled = false in config).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDisabledResponse'
components:
  schemas:
    GraphDisabledResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
      description: Graph feature is disabled (graph.enabled = false in config).
