# Revised after implementation (2026-11-01): generated from the plan's .tsp and not regenerated. The shipped GET /openapi.json (tests/server/openapi_snapshot.json) differs: `description_source` and `description_status` are optional with a null default (not in `required`); a 422 on PUT is FastAPI's list body; PUT/DELETE answer the stored state with no `pending` overlay; POST /describe never answers store_busy (its 503 is "not ready"; job-creation failure is 500). See the C6 .tsp header.
openapi: 3.0.0
info:
  title: Archon Search Collections API (description fields)
  version: 0.0.0
tags: []
paths:
  /collections:
    get:
      operationId: Collections_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionSummary'
  /collections/{name}:
    get:
      operationId: Collections_get
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
    patch:
      operationId: Collections_patch
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unprocessable'
        '503':
          description: Service unavailable.
          content:
            application/json:
