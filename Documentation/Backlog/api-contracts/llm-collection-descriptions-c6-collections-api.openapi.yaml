components:
  schemas:
    CollectionDetail:
      type: object
      required:
        - name
        - path
        - description
        - description_source
        - description_status
        - doc_count
        - chunk_count
        - namespace
        - status
        - active_embedding_model
        - needs_reindex
        - pending_embedding_model
        - reindex_job_id
        - centroid_present
        - last_indexed
        - acl_protected_count
        - acl_open_count
        - default_ttl_seconds
        - schema_version
      properties:
        name:
          type: string
        path:
          type: string
        description:
          type: string
        description_source:
          allOf:
            - $ref: '#/components/schemas/DescriptionSource'
          nullable: true
        description_status:
          allOf:
            - $ref: '#/components/schemas/DescriptionStatus'
          nullable: true
        doc_count:
          type: integer
          format: int32
        chunk_count:
          type: integer
          format: int32
        namespace:
          type: string
        status:
          type: string
        active_embedding_model:
          type: string
        needs_reindex:
          type: boolean
        pending_embedding_model:
          type: string
          nullable: true
        reindex_job_id:
          type: string
          nullable: true
        centroid_present:
          type: boolean
        last_indexed:
          type: string
          nullable: true
        acl_protected_count:
          type: integer
          format: int32
        acl_open_count:
          type: integer
          format: int32
        default_ttl_seconds:
          type: integer
          format: int32
          nullable: true
        schema_version:
          type: integer
          format: int32
    CollectionSummary:
      type: object
      required:
        - name
        - path
        - description
        - description_source
        - description_status
        - doc_count
        - chunk_count
        - namespace
        - status
        - active_embedding_model
        - needs_reindex
      properties:
        name:
          type: string
        path:
          type: string
        description:
          type: string
        description_source:
          allOf:
            - $ref: '#/components/schemas/DescriptionSource'
          nullable: true
        description_status:
          allOf:
            - $ref: '#/components/schemas/DescriptionStatus'
          nullable: true
        doc_count:
          type: integer
          format: int32
        chunk_count:
          type: integer
          format: int32
        namespace:
          type: string
        status:
          type: string
        active_embedding_model:
          type: string
        needs_reindex:
          type: boolean
    Conflict:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    DescriptionSource:
      type: string
      enum:
        - generated
        - manual
    DescriptionStatus:
      type: string
      enum:
        - ok
        - failed
        - pending
    ErrorDetail:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    JobResponse:
      type: object
      required:
        - job_id
        - status
        - created_at
        - updated_at
        - result
        - error
        - namespace
        - progress
        - source
        - source_path
        - collection
        - retry_count
        - output_path
        - archive_path
        - kind
        - migrations_applied
        - backup_confirmed
        - job_type
      properties:
        job_id:
          type: string
        status:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        result:
          anyOf:
            - type: string
            - type: object
              additionalProperties: {}
          nullable: true
        error:
          type: string
          nullable: true
        namespace:
          type: string
        progress:
          type: object
          additionalProperties: {}
          nullable: true
        source:
          type: string
        source_path:
          type: string
        collection:
          type: string
        retry_count:
          type: integer
          format: int32
        output_path:
          type: string
          nullable: true
        archive_path:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
        migrations_applied:
          type: array
          items:
            type: string
          nullable: true
        backup_confirmed:
          type: boolean
          nullable: true
        job_type:
          type: string
    NotFound:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    PatchCollectionBody:
      type: object
      properties:
        embedding_model:
          type: string
        default_ttl_seconds:
          type: integer
          format: int32
          nullable: true
    SetDescriptionBody:
      type: object
      required:
        - description
      properties:
        description:
          type: string
    StoreBusy:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    Unprocessable:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
