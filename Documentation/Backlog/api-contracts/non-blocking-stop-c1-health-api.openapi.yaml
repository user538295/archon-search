openapi: 3.0.0
info:
  title: Archon Search Health API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRunning'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStopping'
components:
  schemas:
    HealthRunning:
      type: object
      required:
        - status
        - version
        - mcp
      properties:
        status:
          type: string
          enum:
            - running
        version:
          type: string
        mcp:
          type: object
          allOf:
            - $ref: '#/components/schemas/McpStatusDetail'
          nullable: true
    HealthStopping:
      type: object
      required:
        - status
        - version
        - mcp
      properties:
        status:
          type: string
          enum:
            - stopping
        version:
          type: string
        mcp:
          type: object
          allOf:
            - $ref: '#/components/schemas/McpStatusDetail'
          nullable: true
    McpStatusDetail:
      type: object
      required:
        - enabled
        - bound
      properties:
        enabled:
          type: boolean
        bound:
          type: boolean
