# Dev overrides — lean image, extras installed at runtime into a named volume,
# config from repo, claude CLI proxied to Mac host.
# Usage:
#   1. python3 scripts/claude-proxy.py   # run on Mac host (separate terminal)
#   2. ARCHON_VERSION=$(git describe --tags --always) docker compose up --build archon-dev
#      (ARCHON_VERSION stamps the real version; omit it and the image reports 0.0.0+docker)
services:
  archon-dev:
    build:
      context: .
      args:
        # `.git` is dockerignored, so pass the host-derived version in.
        # Build with: ARCHON_VERSION=$(git describe --tags --always) docker compose build archon-dev
        RELEASE_VERSION: ${ARCHON_VERSION:-0.0.0}
    image: archon-search:dev
    environment:
      ARCHON_SEARCH_CONFIG: /config/archon-search.toml
      CLAUDE_PROXY_URL: "http://host.docker.internal:18766"
      ARCHON_EXTRAS: "graph,code,multilingual"
    volumes:
      - archon-dev-data:/data
      - archon-dev-packages:/pip-packages
      - ./archon-search.docker-dev.toml:/config/archon-search.toml:ro
      - ./scripts/claude-container-wrapper:/usr/local/bin/claude:ro
      - ~/.archon-search/models:/data/models

  # Test runner — mounts source from host, runs full suite + smoke tests.
  # Usage:
  #   docker compose run --rm archon-test-runner              # full suite + smoke
  #   docker compose run --rm archon-test-runner uv run pytest tests/smoke/ --no-cov
  archon-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/workspace
      - archon-uv-cache:/cache/uv
      - archon-docker-venv:/venv
      - ~/.archon-search/models:/tmp/archon-test/models
    # ponytail: sh -c to run two suites in sequence without a wrapper script
    command:
      - sh
      - -c
      - >-
          uv sync --dev --extra hyde --extra rag-fusion --extra graph;
          uv run pytest;
          uv run pytest tests/smoke/ --no-cov

  # Long-running dev shell — same image as the test runner, shares its deps volumes.
  # First start runs `uv sync` once, then stays alive.
  # Usage:
  #   docker compose up -d archon-dev-shell            # start (setup runs once)
  #   docker compose exec archon-dev-shell bash        # shell in; run tests/server interactively
  #   docker compose stop archon-dev-shell             # stop when done
  archon-dev-shell:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/workspace
      - archon-uv-cache:/cache/uv
      - archon-docker-venv:/venv
      - ~/.archon-search/models:/tmp/archon-test/models
    environment:
      ARCHON_SEARCH_CONTAINER: "1"
      UV_PROJECT_ENVIRONMENT: /venv
      UV_CACHE_DIR: /cache/uv
    command:
      - sh
      - -c
      - >-
          if [ ! -f /venv/bin/activate ]; then
          uv sync --dev --extra hyde --extra rag-fusion --extra graph;
          fi;
          exec sleep infinity

volumes:
  archon-dev-packages:
  archon-uv-cache:
  archon-docker-venv:
