[project]
name = "archon-search"
dynamic = ["version"]
readme = "README.md"
description = "Standalone hybrid retrieval + routing server: LanceDB, fastembed, cross-encoder reranker, FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lancedb>=0.30.0",
    "fastembed>=0.8.0",
    "tomlkit>=0.12",
    "click>=8.1",
    "claude-agent-sdk>=0.1.46",
    "httpx>=0.25",
    "chonkie>=0.5.0",
    "docling>=2.80.0",
    "markitdown[docx,pptx,xls,xlsx,outlook]>=0.1.6,<0.2",
    "watchdog>=3.0",
    "pydantic>=2.0",
    "python-json-logger>=2.0,<3",
    "fastmcp>=3.4,<4",
]

[project.optional-dependencies]
multilingual = ["fasttext-wheel>=0.9.2"]
hyde = ["anthropic>=0.40"]
rag_fusion = ["anthropic>=0.40"]
ollama = ["ollama>=0.3"]
openai-provider = ["openai>=1.0"]
graph = [
    "spacy>=3.8,<3.9",
    "networkx>=3.0",
    "leidenalg>=0.12",
    "igraph>=0.11",
]
code = [
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-bash>=0.25.1,<0.26",
    "tree-sitter-swift>=0.7.3,<0.8",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
]

[project.scripts]
archon-search = "archon_search.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "reportlab>=4.5.1",
    "openai>=1.0",
    "ollama>=0.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# `no-guess-dev` + `no-local-version` produce PyPI-compatible version strings:
# on a tag (e.g. `26.5.0`) the version is exactly `26.5.0`; between tags it is
# `26.5.0.post{N}` where N is the commit distance — no local "+gXXXXX" suffix
# (PyPI rejects local version identifiers on upload).
raw-options.version_scheme = "no-guess-dev"
raw-options.local_scheme = "no-local-version"
raw-options.fallback_version = "0.0.0+local"


[tool.hatch.build.targets.wheel]
# The project name uses a hyphen (PyPI convention) but the importable package
# directory uses an underscore — tell hatchling explicitly so it does not try
# to look for a directory named `archon-search`.
packages = ["archon_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# live_benchmark conftest removes fastembed stubs at module-level (required so the
# test file can `import fastembed` and get the real package). Traversing this directory
# during default collection poisons sys.modules["fastembed"] in every xdist worker,
# breaking all tests that rely on the stubs.  norecursedirs prevents the auto-traverse;
# explicit `uv run pytest tests/eval/live_benchmark/` still works (pytest always
# collects explicitly-passed paths regardless of norecursedirs).
norecursedirs = [
    # pytest defaults (preserved explicitly because specifying norecursedirs replaces them)
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    # live_benchmark conftest removes fastembed stubs at module-level (required so the
    # test file can `import fastembed` and get the real package). Traversing this directory
    # during default collection poisons sys.modules["fastembed"] in every xdist worker,
    # breaking all tests that rely on the stubs.  norecursedirs prevents the auto-traverse;
    # explicit `uv run pytest tests/eval/live_benchmark/` still works (pytest always
    # collects explicitly-passed paths regardless of norecursedirs).
    "tests/eval/live_benchmark",
]
# --cov-fail-under=85 is intended for the default single-run invocation.
# Split / matrix CI runs MUST combine coverage data (coverage combine) before
# applying the fail-under threshold; otherwise the threshold should be passed
# only on the combined report run, not on intermediate invocations.
# `--no-cov` is a local-only override developers can pass on the CLI when
# iterating; it must never be baked into addopts here.
# -n is capped at 4 — never "auto": auto meant 14 workers on this 14-core machine, and on
# model-loading paths each worker holds ~2 GB (fastembed/onnxruntime/torch); stacked runs
# OOM-crashed the 48 GB machine on 2026-07-05 (Jetsam + WindowServer watchdog kill).
addopts = "--strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-fail-under=85 -n 4 --dist=loadgroup --thresholds-path tests/eval/thresholds.toml -m \"not live_benchmark\""
markers = [
    "benchmark: latency benchmark — serialized via xdist_group('benchmark'); server-dependent tests auto-skip when server is unreachable",
    "integration: integration tests requiring live infrastructure",
    "eval: deterministic full-corpus evaluation slice; gated tests skip gracefully without --thresholds-path",
    "live: tests that require live network or external services; skip gracefully when infrastructure is absent",
    "live_eval: full live-model eval suite; skip gracefully when infrastructure is absent",
    "docker: tests that require a running Docker daemon and perform a real image build; excluded from default run, opt in with `-m docker`",
    "archon_unset_data_dir: opt out of the autouse ARCHON_SEARCH_DATA_DIR isolation; the test exercises the Path.home() default-fallback path. Apply to the pinned MARKER_ALLOWLIST in tests/test_no_hardcoded_path_home.py only.",
    "live_benchmark: real-model latency benchmark; requires fastembed model cache; serialised via xdist_group('live_benchmark'); excluded from default suite",
    "unit: plain unit tests with no infrastructure dependencies",
]

[tool.uv]
package = true
