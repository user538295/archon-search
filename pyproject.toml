[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# live_benchmark conftest removes the model-backend stubs at module-level (required so the
# test file gets the real backends). Traversing this directory
# during default collection poisons sys.modules in every xdist worker,
# breaking all tests that rely on the stubs.  norecursedirs prevents the auto-traverse;
# explicit `uv run pytest tests/eval/live_benchmark/` still works (pytest always
# collects explicitly-passed paths regardless of norecursedirs).
norecursedirs = [
    # pytest defaults (preserved explicitly because specifying norecursedirs replaces them)
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    # live_benchmark conftest removes the model-backend stubs at module-level (required so the
    # test file gets the real backends). Traversing this directory
    # during default collection poisons sys.modules in every xdist worker,
    # breaking all tests that rely on the stubs.  norecursedirs prevents the auto-traverse;
    # explicit `uv run pytest tests/eval/live_benchmark/` still works (pytest always
    # collects explicitly-passed paths regardless of norecursedirs).
    "tests/eval/live_benchmark",
    # smoke tests spawn a real archon-search serve subprocess; excluding them prevents
    # the default suite from auto-collecting this directory and spawning the server.
    # Explicit `uv run pytest tests/smoke/ --no-cov` still works (pytest always
    # collects explicitly-passed paths regardless of norecursedirs).
    "tests/smoke",
    # live eval tests shadow the autouse API-key-clearing fixture so they run for real
    # when ANTHROPIC_API_KEY is set; excluding them prevents the default suite from
    # hanging on real model inference. Explicit `uv run pytest tests/eval/live/ --no-cov` works.
    "tests/eval/live",
    # runtime parity tests download ~5 GB of real weights (ARCHON_RUNTIME_PARITY_DATA_DIR) and run
    # full-size models. Explicit `uv run pytest -m runtime_parity tests/runtime_parity/ --no-cov` works.
    "tests/runtime_parity",
]
# --cov-fail-under=85 is intended for the default single-run invocation.
# Split / matrix CI runs MUST combine coverage data (coverage combine) before
# applying the fail-under threshold; otherwise the threshold should be passed
# only on the combined report run, not on intermediate invocations.
# `--no-cov` is a local-only override developers can pass on the CLI when
# iterating; it must never be baked into addopts here.
# -n is capped at 4 — never "auto": auto meant 14 workers on this 14-core machine, and on
# model-loading paths each worker holds ~2 GB (torch); stacked runs
# OOM-crashed the 48 GB machine on 2026-07-05 (Jetsam + WindowServer watchdog kill).
addopts = "--strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-fail-under=85 -n 8 --dist=loadgroup --thresholds-path tests/eval/thresholds.toml -m \"not live_benchmark and not smoke and not live_eval and not docling and not graph_real_artifact and not runtime_parity\""  # -n 8 (raised from 4, 2026-07-20): default suite stubs the model backends → measured ~0.3GB/worker, memory-safe on 14-core/48GB. NEVER -n auto (=14 → 2GB/worker on real-model lanes OOM'd 2026-07-05). See CLAUDE.md testing policy.
# Every StarletteDeprecationWarning is an error (warning-free policy, deliberately the whole
# category: resolve Starlette deprecations, don't accumulate them). Among others this fails
# collection if the httpx2 dev dependency is missing (starlette.testclient httpx fallback).
# An unclosed resource is an error too. A ResourceWarning is almost always raised from
# `__del__`, where Python cannot propagate it, so pytest reports it as a
# PytestUnraisableExceptionWarning; that category must be an error as well for a leak to
# fail the test (it also fails on any other exception Python cannot propagate, e.g. one
# raised in a `__del__` or a GC/weakref callback). The leak is reported when the garbage
# collector frees the object, which can be during a later test in the same xdist worker —
# the failing test is not necessarily the leaker. To find it, rerun the reported file with
# `-n 0` and `PYTHONTRACEMALLOC=20` (the warning then carries the allocation traceback).
# Fix the leak at its source: close the resource in archon or the test, or raise the floor
# of the leaking dependency (as `mcp>=1.30.0` does) — not with an ignore filter, except
# the documented last resort for a leak with no fixed upstream release: see TLG-6 in
# Documentation/Architecture/530_technical_debt_refactoring_roadmap.md.
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "benchmark: latency benchmark — serialized via xdist_group('benchmark'); server-dependent tests auto-skip when server is unreachable",
    "integration: integration tests requiring live infrastructure",
    "eval: deterministic full-corpus evaluation slice; gated tests skip gracefully without --thresholds-path",
    "live: tests that require live network or external services; skip gracefully when infrastructure is absent",
    "live_eval: full live-model eval suite (tests/eval/live/, real model weights via backend=live); excluded from default run via norecursedirs + -m filter; run with `uv run pytest tests/eval/live/ --no-cov`",
    "docker: tests that require a running Docker daemon and perform a real image build; excluded from default run, opt in with `-m docker`",
    "archon_unset_data_dir: opt out of the autouse ARCHON_SEARCH_DATA_DIR isolation; the test exercises the Path.home() default-fallback path. Apply to the pinned MARKER_ALLOWLIST in tests/test_no_hardcoded_path_home.py only.",
    "live_benchmark: real-model latency benchmark; requires the model cache; serialised via xdist_group('live_benchmark'); excluded from default suite",
    "unit: plain unit tests with no infrastructure dependencies",
    "smoke: live subprocess smoke tests; require a real archon-search serve process; excluded from default run via norecursedirs + -m filter; run with `uv run pytest tests/smoke/ --no-cov`",
    "docling: tests that invoke the real docling parser / RapidOCR (PDF & image OCR); a single parse takes minutes on macOS (Metal/RapidOCR), so excluded from the default run via the -m filter; run with `uv run pytest -m docling --no-cov`",
    "graph_real_artifact: tests that load a real graph-NER model artifact (memory / real-artifact determinism); heavyweight, so excluded from the default run via the -m filter and pinned to its own xdist_group; run with `ARCHON_SEARCH_DATA_DIR=\"$HOME/.archon-search\" uv run pytest -m graph_real_artifact --no-cov` (the env var must point at a data dir whose models/graph/ already holds the pinned checkpoint, or the run re-downloads it)",
    "runtime_parity: real-weights parity of the PyTorch embedder/reranker against the frozen fastembed outputs in tests/fixtures/runtime_parity/; excluded from the default run via norecursedirs + the -m filter; needs ARCHON_RUNTIME_PARITY_DATA_DIR (weights are downloaded there once); see the tests/runtime_parity module docstrings for the exact invocation",
    "real_torch_backends: opt out of the autouse stub of ModelEmbedder.encode / ModelReranker.predict (tests/conftest.py _stub_model_backends); the test runs the real PyTorch backends or their loader seam. Apply as a module-level `pytestmark`.",
]

[tool.uv]
package = true

# gliner>=0.2.26 (resolves 0.2.28) caps transformers below 5.14.0, but this repo's
# non-darwin lock resolves transformers to 5.14.1 without a pin. A single
# cross-platform ceiling (not marker-scoped) converges both platforms onto one
# shared transformers version instead of splitting per-platform.
constraint-dependencies = ["transformers>=4.51.3,<5.14.0"]

# PyTorch CPU wheel index (S269). On Linux the default PyPI `torch` wheel
# declares ~18 nvidia-*/cuda* dependencies gated on Linux — the multi-GB CUDA
# runtime a CPU-only host can never execute. Routing torch/torchvision through
# this index resolves the `+cpu` local build (which declares zero nvidia/cuda
# deps). `explicit = true` means the index is used only for the packages that
# opt into it below. This index and [tool.uv.sources] are uv project settings,
# not wheel metadata: they bind `uv lock` / `uv sync` only. `pip install` and
# `uv tool install` of the published wheel still get PyPI's CUDA torch on Linux
# (UserManual/10_installation.md documents the CPU-only install), and the
# `:latest` CPU image gets `+cpu` from the /etc/pip.conf its Dockerfile bakes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Scope the CPU-index pin to linux, both amd64 and arm64: PyPI's linux torch wheel is the
# CUDA build on either arch (it pulls nvidia/cuda; the lock held them before this pin), and
# the CPU index serves `+cpu` wheels for x86_64 and aarch64. Without arm64 here, `uv sync` on linux/arm64
# (Apple Silicon Docker: test runner, dev shell) resolved a ~5.8 GB CUDA venv. macOS and
# Windows torch on PyPI are already CPU-only, so pinning them gains nothing.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
