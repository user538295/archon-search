[project]
name = "archon-search"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Standalone hybrid retrieval + routing server: LanceDB, PyTorch embedder, cross-encoder reranker, FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lancedb>=0.30.0",
    "tomlkit>=0.12",
    "click>=8.1",
    "claude-agent-sdk>=0.1.46",
    "httpx>=0.25",
    "chonkie>=0.5.0",
    "docling>=2.80.0",
    # rapidocr comes from docling (docling-slim[standard]: rapidocr>=3.9.1,<4.0.0). 3.10.0
    # removed `PP_OCRV6_LANGS` from `rapidocr.utils.model_resolver`, which docling 2.135.0
    # imports (docling/models/stages/ocr/rapid_ocr_model.py:190), so every RapidOCR image /
    # scanned-PDF OCR raised ImportError (docling-project/docling#4702). Declared here, in
    # the wheel metadata, because only that reaches pip / `uv tool install` users. Remove
    # the cap once the `docling` floor above is a release that no longer imports
    # PP_OCRV6_LANGS (the unlocked lane, scripts/test-unlocked-deps.sh, proves it).
    "rapidocr>=3.9.1,<3.10",
    # PyTorch runs the embedder and the cross-encoder reranker (torch_runtime.py,
    # reranker_loading.py). torch/torchvision are also pulled by docling; they are
    # declared here as direct dependencies so the [tool.uv.sources] CPU-index pin
    # below binds (uv applies sources to declared deps, not transitive-only
    # ones). The ceiling and torchvision mirror docling's own `torch<3.0.0` /
    # `torchvision<1`. The floor is 2.4, above docling's `torch>=2.2.2`: with Python
    # >= 3.12, torch 2.2.2 and 2.3.1 cannot load ModernBERT (a registry embedder; its
    # `torch.compile` raises "Dynamo is not supported on Python 3.12+") and transformers
    # 5.13 treats torch < 2.4 as absent; 2.4.1 passed the unit and parity lanes on
    # transformers 4.57.1 and 5.13.1. S269: on linux/amd64 the default PyPI torch drags
    # the ~6 GB CUDA runtime a CPU host cannot run.
    "torch>=2.4,<3.0.0",
    "torchvision<1",
    # transformers builds the encoder and sequence-classification models
    # (torch_runtime.py, reranker_loading.py). Ceiling matches constraint-dependencies.
    "transformers>=4.57,<5.14",
    # Tokenizer.from_file loads each snapshot's tokenizer.json (torch_runtime.py, reranker_loading.py).
    "tokenizers",
    # safe_open reads the XLM-R classifier head from model.safetensors (reranker_loading.py).
    "safetensors",
    # snapshot_download fetches the pinned model snapshots (model_store.py).
    "huggingface-hub",
    "markitdown[docx,pptx,xls,xlsx,outlook]>=0.1.6,<0.2",
    "watchdog>=3.0",
    "pydantic>=2.0",
    "python-json-logger>=2.0,<3",
    "fastmcp>=3.4,<4",
    # mcp comes from fastmcp (fastmcp-slim 3.4.x: mcp>=1.24.0,<2.0). mcp <=1.29.x closed the
    # SSE response stream of a Streamable HTTP POST only on error, so every normally answered
    # POST leaked one unclosed anyio MemoryObjectReceiveStream (ResourceWarning); fixed in 1.30.0
    # (modelcontextprotocol/python-sdk#3426). Declared here, in the wheel metadata, because
    # only that reaches pip / `uv tool install` users. Does not over-constrain: every
    # fastmcp(-slim) 3.4.0–3.4.8 requires mcp>=1.24.0,<2.0, so the floor excludes no fastmcp
    # release. Remove once the fastmcp floor requires mcp>=1.30.0 itself.
    "mcp>=1.30.0",
]

[project.optional-dependencies]
multilingual = ["fasttext-wheel>=0.9.2"]
hyde = ["anthropic>=0.40"]
rag_fusion = ["anthropic>=0.40"]
ollama = ["ollama>=0.3"]
openai-provider = ["openai>=1.0"]
graph = [
    "gliner>=0.2.26",
    "networkx>=3.0",
    "leidenalg>=0.12",
    "igraph>=0.11",
]
code = [
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-bash>=0.25.1,<0.26",
    "tree-sitter-swift>=0.7.3,<0.8",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
]

[project.scripts]
archon-search = "archon_search.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "reportlab>=4.5.1",
    "openai>=1.0",
    "ollama>=0.3",
    "textual>=0.80",
    "xlwt>=1.3",
    # Pull all feature extras into the default `uv sync` so no test skips for a
    # missing optional dep (uv 0.11 has no config to auto-install extras).
    "archon-search[multilingual,hyde,rag_fusion,ollama,openai-provider,graph,code]",
    # FastAPI/Starlette TestClient backend (starlette.testclient imports httpx2 first and
    # warns on the httpx fallback). Runtime code keeps using httpx.
    "httpx2>=2.0.0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# `no-guess-dev` + `no-local-version` produce PyPI-compatible version strings:
# on a tag (e.g. `26.5.0`) the version is exactly `26.5.0`; between tags it is
# `26.5.0.post{N}` where N is the commit distance — no local "+gXXXXX" suffix
# (PyPI rejects local version identifiers on upload).
raw-options.version_scheme = "no-guess-dev"
raw-options.local_scheme = "no-local-version"
raw-options.fallback_version = "0.0.0+local"


[tool.hatch.build.targets.wheel]
# The project name uses a hyphen (PyPI convention) but the importable package
# directory uses an underscore — tell hatchling explicitly so it does not try
# to look for a directory named `archon-search`.
packages = ["archon_search"]

[tool.ruff]
# The eval corpus `.py` files are retrieval fixture DATA, not code: "fixing" them
# changes the indexed text and shifts the eval metrics against the baselines.
extend-exclude = ["tests/eval/corpus"]

