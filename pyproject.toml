[project]
name = "archon-search"
dynamic = ["version"]
description = "Standalone Search server for Archon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "lancedb>=0.30.0",
    "fastembed>=0.8.0",
    "tomlkit>=0.12",
    "click>=8.1",
    "claude-agent-sdk>=0.1.46",
    "httpx>=0.25",
    "chonkie>=0.5.0",
    "docling>=2.80.0",
    "watchdog>=3.0",
    "pydantic>=2.0",
]

[project.scripts]
archon-search = "archon_search.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.version_scheme = "_version_scheme:calver_total_count"
# Phase 1 only: the package lives under packages/archon-search/ in the monorepo,
# but git tags live at the monorepo root. After Phase 2 extraction (the package
# becomes the repo root) the `root = ".."` line MUST be removed.
raw-options.root = ".."
raw-options.fallback_version = "0.0.0+local"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# --cov-fail-under=85 is intended for the default single-run invocation.
# Split / matrix CI runs MUST combine coverage data (coverage combine) before
# applying the fail-under threshold; otherwise the threshold should be passed
# only on the combined report run, not on intermediate invocations.
# `--no-cov` is a local-only override developers can pass on the CLI when
# iterating; it must never be baked into addopts here.
addopts = "--strict-markers --strict-config --cov=archon_search --cov-report=term-missing --cov-fail-under=85 -m 'not live and not eval and not benchmark and not integration'"
markers = [
    "benchmark: latency benchmark — requires a running archon-search server; skipped automatically when server is unreachable",
    "integration: integration tests requiring live infrastructure",
    "eval: deterministic full-corpus FEAT-039 evaluation slice; excluded from default runs",
    "live: tests that require live network or external services; excluded from default runs",
]

[tool.uv]
package = true
